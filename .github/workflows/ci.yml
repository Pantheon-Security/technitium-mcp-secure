name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      # SHA-pinned per the project's exact-pinning supply-chain policy.
      # checkout v6.0.2, setup-node v6.4.0
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: "20"
      - run: npm ci --ignore-scripts
      - run: npm run lint
      - run: npm run build
      - run: npm test
      # Gated at 'moderate'. All known advisories in the SDK's HTTP-transport
      # deps are patched via pinned overrides (hono, express-rate-limit,
      # ip-address, qs) — npm audit reports zero. This project uses a 14-day
      # age threshold (see CLAUDE.md), which let the remaining moderate fixes
      # be taken once their patches cleared 14 days.
      - run: npm audit --audit-level=moderate
