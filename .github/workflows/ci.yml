name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      # SHA-pinned per the project's exact-pinning supply-chain policy.
      # checkout v6.0.2, setup-node v6.4.0
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: "20"
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: npm test
      # Gated at 'high'. The high advisories in the SDK's HTTP-transport deps
      # (hono, express-rate-limit, ip-address) are patched via pinned overrides
      # once their fixes passed the 30-day rule. Remaining advisories are all
      # moderate and still held by the rule (qs fix ~2026-06-15, hono 4.12.21
      # fix ~2026-06-19); take them and consider --audit-level=moderate then.
      - run: npm audit --audit-level=high
