name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      # SHA-pinned per the project's exact-pinning supply-chain policy.
      # checkout v6.0.2, setup-node v6.4.0
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: "20"
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: npm test
      # Gated at 'critical' while the remaining high advisories (qs, hono) sit
      # in @modelcontextprotocol/sdk's HTTP-transport deps — unreachable in this
      # stdio-only server, and their patches are <30 days old (held by the
      # 30-day supply-chain rule). Raise to --audit-level=high once taken (target 2026-06-15).
      - run: npm audit --audit-level=critical
